# Fly.io deployment config for AfricgreenOS Go backend
# Deploy: fly deploy --config backend/fly.toml

app = "africgreen-api"
primary_region = "cdg" # Paris (closest to East Africa with good latency)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"
