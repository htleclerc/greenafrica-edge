# fly.toml app configuration file generated for greengate-prod on 2026-07-18T17:34:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'greengate-prod'
primary_region = 'ams'

[build]

[processes]
  api = '/africgreen-api'
  scraper = '/africgreen-scraper'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['api']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
