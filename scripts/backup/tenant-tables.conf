# Classement des tables qui ne portent PAS de colonne jurisdiction_id.
#
# Une table du schéma public est dans l'un de ces cas :
#
#   (rien à écrire ici)  elle porte jurisdiction_id : elle est exportée
#                        automatiquement, filtrée sur le pays demandé ;
#   GLOBAL               référentiel ou réglage commun à tous les pays : exporté
#                        en entier, à part, pour pouvoir reconstruire un projet ;
#   DERIVED              donnée d'un pays sans la colonne : le filtre est écrit
#                        ici. `:jid` = identifiant du pays ;
#   SKIP                 suivi, cache ou file d'attente : jamais exporté.
#
# L'export REFUSE de tourner si une table n'est dans aucun de ces cas. C'est
# voulu : toute nouvelle table doit être classée, sinon ses données resteraient
# en silence dans la base partagée le jour où un pays s'en va.
#
# Format : table|CLASSE|filtre (le filtre seulement pour DERIVED, sur une ligne).

# ── Référentiels et réglages communs ─────────────────────────────────────────
air_emission_factors|GLOBAL|
emission_factors|GLOBAL|
methodologies|GLOBAL|
fx_rates|GLOBAL|
app_config|GLOBAL|
payment_config|GLOBAL|
tax_configurations|GLOBAL|
carbon_projects|GLOBAL|

# ── Données d'un pays, sans la colonne ───────────────────────────────────────
jurisdictions|DERIVED|id = :jid
profiles|DERIVED|id IN (SELECT id FROM _exp_people)
staff_notification_reads|DERIVED|notification_id IN (SELECT id FROM public.staff_notifications WHERE jurisdiction_id = :jid)
# `jurisdiction` y est un texte libre saisi à l'inscription : on retient les
# demandes qui nomment le pays par son code ou par son nom.
registration_requests|DERIVED|lower(jurisdiction) IN (SELECT lower(code) FROM public.jurisdictions WHERE id = :jid UNION SELECT lower(name) FROM public.jurisdictions WHERE id = :jid)

# ── Jamais exporté ───────────────────────────────────────────────────────────
# Positions : suivi mondial des navires et des aéronefs, pas la donnée d'un État.
vessel_positions|SKIP|
aircraft_positions|SKIP|
# Caches, files et propositions d'outillage : se reconstruisent.
eu_mrv_cache|SKIP|
idempotency_keys|SKIP|
equasis_scrape_proposals|SKIP|
destination_match_proposals|SKIP|
vessel_identity_candidates|SKIP|
