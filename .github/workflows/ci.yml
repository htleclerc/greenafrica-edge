name: CI — Lint, Test, Build

on:
  pull_request:
    branches: [main, develop]
  workflow_call: # porte CI appelee par deploy-staging.yml et deploy-production.yml
    inputs:
      full:
        description: "Tout executer sans filtrage par chemin (promotion vers main)."
        type: boolean
        default: false

# Le declencheur `push` a ete retire : les deux workflows de deploiement
# appellent deja cette CI comme porte, donc chaque fusion la lancait DEUX fois
# sur le meme commit (constate le 2026-08-19 sur 679a094). Les PR restent
# couvertes par le declencheur `pull_request`.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Perimetre : que faut-il reellement executer sur ce commit ? ───────────
  # Sur main (promotion, ou PR ciblant main) : tout, sans condition.
  # Ailleurs : seulement les domaines touches par le diff.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.s.outputs.full }}
      frontend: ${{ steps.s.outputs.frontend }}
      backend: ${{ steps.s.outputs.backend }}
      db: ${{ steps.s.outputs.db }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: s
        env:
          FULL_INPUT: ${{ inputs.full }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -u
          FULL=false
          if [ "${FULL_INPUT:-false}" = "true" ] || [ "${BASE_REF:-}" = "main" ]; then
            FULL=true
          fi

          FILES=""
          if [ "$FULL" != "true" ]; then
            if [ -n "${BASE_REF:-}" ]; then
              git fetch origin "$BASE_REF" --depth=200 >/dev/null 2>&1 || true
              FILES=$(git diff --name-only "origin/$BASE_REF...HEAD" 2>/dev/null || true)
            elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              FILES=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null || true)
            fi
            # Diff indisponible (historique tronque, premier push d'une branche) :
            # on ne devine pas, on execute tout.
            if [ -z "$FILES" ]; then
              FULL=true
            fi
          fi

          if [ "$FULL" = "true" ]; then
            FE=true; BE=true; DB=true
          else
            # GitHub execute les `run:` avec `bash -eo pipefail` : un `grep`
            # sans correspondance renvoie 1 et, hors d'un `if`, abandonne le
            # script. Ne pas revenir a la forme `grep -q ... && VAR=true`.
            FE=false; BE=false; DB=false
            if echo "$FILES" | grep -qE '^frontend/'; then FE=true; fi
            if echo "$FILES" | grep -qE '^backend/';  then BE=true; fi
            if echo "$FILES" | grep -qE '^supabase/'; then DB=true; fi
            # Un changement de workflow peut affecter n'importe quel domaine.
            if echo "$FILES" | grep -qE '^\.github/workflows/'; then
              FE=true; BE=true; DB=true
            fi
          fi

          echo "full=$FULL"   >> "$GITHUB_OUTPUT"
          echo "frontend=$FE" >> "$GITHUB_OUTPUT"
          echo "backend=$BE"  >> "$GITHUB_OUTPUT"
          echo "db=$DB"       >> "$GITHUB_OUTPUT"
          {
            echo "### Perimetre CI"
            echo "- complet : \`$FULL\`"
            echo "- frontend : \`$FE\` · backend : \`$BE\` · base : \`$DB\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Frontend checks ──────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: [scope]
    if: ${{ needs.scope.outputs.frontend == 'true' }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint (warnings only — legacy code)
        run: npm run lint
        continue-on-error: true

      - name: Tests
        run: npm run test

      - name: Locale files valid
        run: |
          for f in messages/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "✓ $f" || exit 1
          done

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # ── Secret scan (gitleaks) ───────────────────────────────────────────────
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # l'action liste les commits de la PR par l'API : sans ca, 403 sur les PR
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Backend checks (Go) ──────────────────────────────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    needs: [scope]
    if: ${{ needs.scope.outputs.backend == 'true' }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25' # must satisfy backend/go.mod `go 1.25.0` (GOTOOLCHAIN=local)
          cache-dependency-path: backend/go.sum

      - name: Tidy modules
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /dev/null ./cmd/api
      # NB: `go test` lives in the `integration` job below — most Go packages
      # (eez, corridor, modeconfig, geofence, reconcile…) are DB-integration
      # tests that need a migrated Postgres, which this DB-less job can't provide.

  # ── Integration: Postgres migrations, RLS .test.sql, and DB-backed Go tests ─
  integration:
    name: Integration (pg + Go)
    runs-on: ubuntu-latest
    needs: [scope]
    # Les tests Go adosses a la base ET les .test.sql : un changement de l'un ou
    # de l'autre doit les declencher. C'est ce job qui a attrape, le 2026-08-19,
    # deux tests pg perimes qui bloquaient toute mise en production.
    if: ${{ needs.scope.outputs.backend == 'true' || needs.scope.outputs.db == 'true' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25' # must satisfy backend/go.mod `go 1.25.0` (GOTOOLCHAIN=local)
          cache-dependency-path: backend/go.sum

      # Pinned (not `latest`): the RLS tests rely on the blanket
      # GRANT … TO authenticated that older Supabase seeded by default; CLI
      # ≥ 2.9x dropped it, so `latest` breaks them with "permission denied for
      # table". 2.90.0 mirrors the local dev environment and keeps CI
      # deterministic. Follow-up (P2): add explicit table GRANTs in a migration
      # so the suite no longer depends on the legacy implicit grant.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      # Boots the local stack (Docker), applying migrations 001→latest + seed.sql.
      - name: Start Supabase (apply migrations + seed)
        run: supabase start

      # Every supabase/tests/migrations/*.test.sql wraps its assertions in
      # BEGIN…ROLLBACK and RAISE EXCEPTION on failure, so ON_ERROR_STOP=1 turns
      # a failed assertion into a non-zero psql exit. Run all, report each.
      - name: Run pg migration tests
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          fail=0
          for f in supabase/tests/migrations/*.test.sql; do
            echo "── $f"
            if ! psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"; then
              echo "::error file=$f::pg test FAILED"
              fail=1
            fi
          done
          exit $fail

      # -p 1 is REQUIRED: the corridor/eez/modeconfig packages each mutate the
      # shared public.jurisdiction_mode_config matrix. Running packages in
      # parallel against the one local DB lets one package disable a mode while
      # another reads it → cross-package pollution. Serialise package execution.
      - name: Run Go tests (DB-backed)
        run: go test -p 1 ./...
        working-directory: backend
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
