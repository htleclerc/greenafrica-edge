name: CI — Lint, Test, Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend checks ──────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint (warnings only — legacy code)
        run: npm run lint
        continue-on-error: true

      - name: Tests
        run: npm run test

      - name: Locale files valid
        run: |
          for f in messages/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "✓ $f" || exit 1
          done

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # ── Backend checks (Go) ──────────────────────────────────────────────────
  # Disabled until go.sum is generated (Go not installed locally yet).
  # To enable: cd backend && go mod tidy && git add go.sum && uncomment below.
  #
  # backend:
  #   name: Backend (Go)
  #   runs-on: ubuntu-latest
  #   defaults:
  #     run:
  #       working-directory: backend
  #   steps:
  #     - uses: actions/checkout@v4
