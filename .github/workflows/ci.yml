name: CI — Lint, Test, Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call: {} # callable as the CI gate from deploy-production.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend checks ──────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint (warnings only — legacy code)
        run: npm run lint
        continue-on-error: true

      - name: Tests
        run: npm run test

      - name: Locale files valid
        run: |
          for f in messages/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "✓ $f" || exit 1
          done

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # ── Backend checks (Go) ──────────────────────────────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25' # must satisfy backend/go.mod `go 1.25.0` (GOTOOLCHAIN=local)
          cache-dependency-path: backend/go.sum

      - name: Tidy modules
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /dev/null ./cmd/api
      # NB: `go test` lives in the `integration` job below — most Go packages
      # (eez, corridor, modeconfig, geofence, reconcile…) are DB-integration
      # tests that need a migrated Postgres, which this DB-less job can't provide.

  # ── Integration: Postgres migrations, RLS .test.sql, and DB-backed Go tests ─
  integration:
    name: Integration (pg + Go)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25' # must satisfy backend/go.mod `go 1.25.0` (GOTOOLCHAIN=local)
          cache-dependency-path: backend/go.sum

      # Pinned (not `latest`): the RLS tests rely on the blanket
      # GRANT … TO authenticated that older Supabase seeded by default; CLI
      # ≥ 2.9x dropped it, so `latest` breaks them with "permission denied for
      # table". 2.90.0 mirrors the local dev environment and keeps CI
      # deterministic. Follow-up (P2): add explicit table GRANTs in a migration
      # so the suite no longer depends on the legacy implicit grant.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      # Boots the local stack (Docker), applying migrations 001→latest + seed.sql.
      - name: Start Supabase (apply migrations + seed)
        run: supabase start

      # Every supabase/tests/migrations/*.test.sql wraps its assertions in
      # BEGIN…ROLLBACK and RAISE EXCEPTION on failure, so ON_ERROR_STOP=1 turns
      # a failed assertion into a non-zero psql exit. Run all, report each.
      - name: Run pg migration tests
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          fail=0
          for f in supabase/tests/migrations/*.test.sql; do
            echo "── $f"
            if ! psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"; then
              echo "::error file=$f::pg test FAILED"
              fail=1
            fi
          done
          exit $fail

      # -p 1 is REQUIRED: the corridor/eez/modeconfig packages each mutate the
      # shared public.jurisdiction_mode_config matrix. Running packages in
      # parallel against the one local DB lets one package disable a mode while
      # another reads it → cross-package pollution. Serialise package execution.
      - name: Run Go tests (DB-backed)
        run: go test -p 1 ./...
        working-directory: backend
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
