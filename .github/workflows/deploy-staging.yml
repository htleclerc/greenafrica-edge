name: Deploy — Staging (develop)

# Mirror of deploy-production.yml, targeting the STAGING environment.
# Branch → environment mapping:
#   develop → staging  (existing Supabase project + Fly app 'africgreen')
#   main    → production (new Supabase project + Fly app 'greengate-prod')
# Each GitHub Environment (staging / production) holds its OWN values for the
# same secret names (SUPABASE_DB_URL, FLY_API_TOKEN, BACKEND_URL, PRODUCTION_URL,
# VERCEL_*), so the YAML differs from production only by the `environment:` name,
# the Fly app, and the repo-level Vercel gate variable (VERCEL_STAGING_ENABLED
# vs VERCEL_PROD_ENABLED).

on:
  push:
    branches: [develop]

concurrency:
  group: staging
  cancel-in-progress: false # never cancel a deploy mid-flight

jobs:
  # ── Gate: CI must pass first ─────────────────────────────────────────────
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ── Supabase migrations ─────────────────────────────────────────────────
  migrations:
    name: Supabase Migrations
    runs-on: ubuntu-latest
    needs: [ci]
    # Resolves SUPABASE_DB_URL to the STAGING Supabase project's secret
    # (the original hosted project, now used as staging/dev).
    environment: staging

    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Same proven path as production: direct Postgres auth via the pooler URL.
      # Le 2026-08-22, ce job echouait sur « tenant/user postgres.<ref> not
      # found » : le secret de l'environnement pointait un pooler qui n'heberge
      # pas ce projet. L'erreur brute de pgx ne nomme ni le secret ni
      # l'environnement — de quoi chercher longtemps du cote des migrations.
      - name: Verify SUPABASE_DB_URL is set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL est vide pour l'environnement GitHub « staging ». Renseigne-le depuis Supabase > Project Settings > Database > Connection string."
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::SUPABASE_DB_URL ne ressemble pas a une URL Postgres (environnement « staging »)."; exit 1 ;;
          esac

      - name: Run migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # pipefail sinon le statut du pipe est celui de `tee` : un push en
          # echec passerait pour un succes et les deploiements suivants
          # partiraient sur une base non migree.
          set -o pipefail
          if ! supabase db push --db-url "$SUPABASE_DB_URL" --yes 2>&1 | tee push.log; then
            if grep -qi "tenant/user\|Tenant or user not found" push.log; then
              echo "::error::Le pooler refuse le couple hote/tenant : le secret SUPABASE_DB_URL de l'environnement « staging » ne correspond pas a ce projet Supabase (mauvaise region de pooler, ou reference de projet obsolete). Recopie la Connection string depuis le dashboard."
            fi
            echo "::error::Migrations non appliquees — les deploiements qui en dependent seront SAUTES."
            exit 1
          fi

  # ── Go backend deploy (Fly.io) ──────────────────────────────────────────
  backend:
    name: Fly.io Backend
    runs-on: ubuntu-latest
    needs: [ci, migrations]
    # Resolves FLY_API_TOKEN / BACKEND_URL to the STAGING secrets.
    environment: staging

    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Deploys to the original 'africgreen' Fly app (staging). fly.toml already
      # declares app = 'africgreen', so no --app override is needed here.
      - name: Deploy backend
        run: flyctl deploy --remote-only --config fly.toml --dockerfile Dockerfile
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Backend health check
        run: |
          sleep 10
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${{ secrets.BACKEND_URL }}/health" || echo "000")
          echo "Backend status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Backend health check returned $STATUS — may still be starting"
          fi
          echo "### Backend (staging): HTTP $STATUS" >> "$GITHUB_STEP_SUMMARY"

  # ── Vercel staging deploy ────────────────────────────────────────────────
  deploy:
    name: Vercel Staging
    runs-on: ubuntu-latest
    # Opt-in via a REPO-level variable (environment-scoped vars are invisible to a
    # job-level `if:`). Separate from production's VERCEL_PROD_ENABLED so enabling
    # one never triggers the other. The frontend also auto-deploys `develop` via
    # Vercel's native git integration; this job can stay disabled.
    #   gh variable set VERCEL_STAGING_ENABLED --body "true" -R htleclerc/africgreen
    if: ${{ vars.VERCEL_STAGING_ENABLED == 'true' }}
    needs: [ci, migrations]
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    # Targets the staging Vercel project without interactive linking (parity with prod).
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel env
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Deploy Staging
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Frontend (staging): $URL" >> "$GITHUB_STEP_SUMMARY"
        working-directory: frontend

  # ── Post-deploy health checks ────────────────────────────────────────────
  healthcheck:
    name: Health Checks
    runs-on: ubuntu-latest
    # Depend des deux deploiements et s'execute meme si l'un echoue ou est
    # saute — meme correctif que la production le 2026-08-19. Sans `always()`,
    # un job `migrations` en echec faisait sauter backend PUIS healthcheck :
    # la staging cessait d'etre deployee sans que rien ne le dise.
    needs: [backend, deploy]
    if: ${{ always() }}
    # Resolves PRODUCTION_URL / BACKEND_URL to the STAGING secrets.
    environment: staging

    steps:
      - name: Report skipped deployments
        if: ${{ needs.backend.result != 'success' || needs.deploy.result == 'skipped' }}
        run: |
          echo "::warning::Deploiement incomplet — backend: ${{ needs.backend.result }}, frontend: ${{ needs.deploy.result }}. Les controles ci-dessous portent sur la VERSION DEJA EN LIGNE, pas sur ce commit."
          echo "### Deploiement incomplet — backend \`${{ needs.backend.result }}\` · frontend \`${{ needs.deploy.result }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for deploy propagation
        run: sleep 15

      - name: Check frontend
        run: |
          STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" "${{ secrets.PRODUCTION_URL }}/login" || echo "000")
          echo "Frontend: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Frontend health check failed with status $STATUS"
            exit 1
          fi
          echo "### Frontend healthy (HTTP $STATUS)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.BACKEND_URL }}/health" || echo "000")
          echo "Backend: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Backend health check failed with status $STATUS"
            exit 1
          fi
          echo "### Backend healthy (HTTP $STATUS)" >> "$GITHUB_STEP_SUMMARY"
