name: Deploy — Staging (develop)

# Mirror of deploy-production.yml, targeting the STAGING environment.
# Branch → environment mapping:
#   develop → staging  (existing Supabase project + Fly app 'africgreen')
#   main    → production (new Supabase project + Fly app 'africgreen-prod')
# Each GitHub Environment (staging / production) holds its OWN values for the
# same secret names (SUPABASE_DB_URL, FLY_API_TOKEN, BACKEND_URL,
# PRODUCTION_URL, VERCEL_TOKEN) and the VERCEL_ENABLED variable, so the YAML
# differs from production only by the `environment:` name and the Fly app.

on:
  push:
    branches: [develop]

concurrency:
  group: staging
  cancel-in-progress: false # never cancel a deploy mid-flight

jobs:
  # ── Gate: CI must pass first ─────────────────────────────────────────────
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ── Supabase migrations ─────────────────────────────────────────────────
  migrations:
    name: Supabase Migrations
    runs-on: ubuntu-latest
    needs: [ci]
    # Resolves SUPABASE_DB_URL to the STAGING Supabase project's secret
    # (the original hosted project, now used as staging/dev).
    environment: staging

    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Same proven path as production: direct Postgres auth via the pooler URL.
      - name: Run migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  # ── Go backend deploy (Fly.io) ──────────────────────────────────────────
  backend:
    name: Fly.io Backend
    runs-on: ubuntu-latest
    needs: [ci, migrations]
    # Resolves FLY_API_TOKEN / BACKEND_URL to the STAGING secrets.
    environment: staging

    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Deploys to the original 'africgreen' Fly app (staging). fly.toml already
      # declares app = 'africgreen', so no --app override is needed here.
      - name: Deploy backend
        run: flyctl deploy --remote-only --config fly.toml --dockerfile Dockerfile
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Backend health check
        run: |
          sleep 10
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${{ secrets.BACKEND_URL }}/health" || echo "000")
          echo "Backend status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Backend health check returned $STATUS — may still be starting"
          fi
          echo "### Backend (staging): HTTP $STATUS" >> "$GITHUB_STEP_SUMMARY"

  # ── Vercel staging deploy ────────────────────────────────────────────────
  deploy:
    name: Vercel Staging
    runs-on: ubuntu-latest
    # Opt-in: skips cleanly until the staging environment's Vercel secrets are set.
    # The frontend also auto-deploys `develop` via Vercel's native git integration;
    # this job is here for parity with production and can stay disabled.
    if: ${{ vars.VERCEL_ENABLED == 'true' }}
    needs: [ci, migrations]
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel env
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Deploy Staging
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Frontend (staging): $URL" >> "$GITHUB_STEP_SUMMARY"
        working-directory: frontend

  # ── Post-deploy health checks ────────────────────────────────────────────
  healthcheck:
    name: Health Checks
    runs-on: ubuntu-latest
    needs: [backend]
    # Resolves PRODUCTION_URL / BACKEND_URL to the STAGING secrets.
    environment: staging

    steps:
      - name: Wait for deploy propagation
        run: sleep 15

      - name: Check frontend
        run: |
          STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" "${{ secrets.PRODUCTION_URL }}/login" || echo "000")
          echo "Frontend: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Frontend health check failed with status $STATUS"
            exit 1
          fi
          echo "### Frontend healthy (HTTP $STATUS)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.BACKEND_URL }}/health" || echo "000")
          echo "Backend: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Backend health check failed with status $STATUS"
            exit 1
          fi
          echo "### Backend healthy (HTTP $STATUS)" >> "$GITHUB_STEP_SUMMARY"
