name: Deploy — Production (main)

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false # never cancel a prod deploy mid-flight

jobs:
  # ── Gate: CI must pass first ─────────────────────────────────────────────
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    # Sur main on ne filtre rien : une promotion valide l'ensemble, quel que
    # soit le diff. Le filtrage par chemin n'a lieu que sur develop et les PR.
    with:
      full: true
    secrets: inherit

  # ── Supabase migrations ─────────────────────────────────────────────────
  migrations:
    name: Supabase Migrations
    runs-on: ubuntu-latest
    needs: [ci]
    # Resolves SUPABASE_DB_URL to the PRODUCTION Supabase project's secret.
    environment: production

    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Direct Postgres auth via the pooler URL (secret SUPABASE_DB_URL).
      # `supabase link` needs a management-API access token the CI doesn't have
      # (and the CLI token lacks privileges on this org) — db push --db-url is
      # the proven path used for every hosted push since 2026-05.
      # Le 2026-08-22, ce job echouait sur « tenant/user postgres.<ref> not
      # found » : le secret de l'environnement pointait un pooler qui n'heberge
      # pas ce projet. L'erreur brute de pgx ne nomme ni le secret ni
      # l'environnement — de quoi chercher longtemps du cote des migrations.
      - name: Verify SUPABASE_DB_URL is set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL est vide pour l'environnement GitHub « production ». Renseigne-le depuis Supabase > Project Settings > Database > Connection string."
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::SUPABASE_DB_URL ne ressemble pas a une URL Postgres (environnement « production »)."; exit 1 ;;
          esac

      - name: Run migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # pipefail sinon le statut du pipe est celui de `tee` : un push en
          # echec passerait pour un succes et les deploiements suivants
          # partiraient sur une base non migree.
          set -o pipefail
          if ! supabase db push --db-url "$SUPABASE_DB_URL" --yes 2>&1 | tee push.log; then
            if grep -qi "tenant/user\|Tenant or user not found" push.log; then
              echo "::error::Le pooler refuse le couple hote/tenant : le secret SUPABASE_DB_URL de l'environnement « production » ne correspond pas a ce projet Supabase (mauvaise region de pooler, ou reference de projet obsolete). Recopie la Connection string depuis le dashboard."
            fi
            echo "::error::Migrations non appliquees — les deploiements qui en dependent seront SAUTES."
            exit 1
          fi

  # ── Go backend deploy (Fly.io) ──────────────────────────────────────────
  backend:
    name: Fly.io Backend
    runs-on: ubuntu-latest
    needs: [ci, migrations] # tariffs/geofences migrations MUST land before the fail-closed Go deploy (W2)
    # Resolves FLY_API_TOKEN / BACKEND_URL to the PRODUCTION secrets.
    environment: production

    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Paths are relative to working-directory (backend/): the old
      # `--config backend/fly.toml` resolved to backend/backend/fly.toml →
      # flyctl fell back to an empty config ("missing app name") — this job
      # had NEVER succeeded. The Dockerfile expects build context = backend/.
      # `--app greengate-prod` overrides `app = 'africgreen'` in fly.toml so
      # the same config deploys to the dedicated production Fly app (staging
      # keeps the original 'africgreen' app — see deploy-staging.yml).
      - name: Deploy backend
        run: flyctl deploy --remote-only --app greengate-prod --config fly.toml --dockerfile Dockerfile
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Backend health check
        run: |
          sleep 10
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${{ secrets.BACKEND_URL }}/health" || echo "000")
          echo "Backend status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Backend health check returned $STATUS — may still be starting"
          fi
          echo "### Backend: HTTP $STATUS" >> "$GITHUB_STEP_SUMMARY"

  # ── Vercel production deploy ─────────────────────────────────────────────
  deploy:
    name: Vercel Production
    runs-on: ubuntu-latest
    # Opt-in: skips cleanly until VERCEL_TOKEN/ORG_ID/PROJECT_ID secrets are configured.
    # Gated on a REPO-level variable (not environment-scoped): a job-level `if:` is
    # evaluated before the job's environment resolves, so an environment-scoped
    # variable is invisible here and the job would always skip. Enable with:
    #   gh variable set VERCEL_PROD_ENABLED --body "true" -R htleclerc/africgreen
    # Note: `healthcheck` depends on `backend` only and runs regardless of this job.
    if: ${{ vars.VERCEL_PROD_ENABLED == 'true' }}
    needs: [ci, migrations]
    # Sans plafond, `vercel deploy` attend indefiniment que le deploiement soit
    # pret. Le 2026-08-19 le job a consomme les 6 h du plafond GitHub par defaut
    # avant d'etre tue, sans jamais promouvoir l'alias.
    timeout-minutes: 25
    # contents: write — le pas « signature de promotion » ci-dessous pousse un
    # commit vide sur main quand l'auteur du sommet n'est pas celui qu'exige
    # Vercel. Sans ce droit, le pas echoue et le deploiement reste bloque.
    permissions:
      contents: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    # VERCEL_ORG_ID / VERCEL_PROJECT_ID let the CLI target the right project on
    # the production Vercel account (possibly a different account than staging)
    # without interactive linking — required for token-based cross-account deploy.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # ── Signature de promotion ────────────────────────────────────────────
      # Le projet Vercel `greengate` est sur un compte Hobby avec un depot
      # prive. Regle Vercel : « For personal Hobby projects, the commit author
      # must be the owner of the Hobby team. If the author is not the owner,
      # the deployment is blocked. »
      #
      # Ca s'est produit deux fois. Le 2026-08-19 puis le 2026-08-24 : la PR
      # #121 fusionnee par `htleclerc` a produit un commit de fusion signe
      # htleclerc, Vercel a bloque, la CLI est restee sur « Building… » jusqu'au
      # plafond de 25 min, et greengate.africa a servi un build perime.
      #
      # La convention (fusion locale signee) reste la bonne pratique, mais elle
      # depend d'un geste humain. Ce pas la rend inutile : quelle que soit la
      # facon dont la promotion est faite — `gh pr merge`, bouton GitHub,
      # fusion locale non signee — le sommet de main porte l'auteur attendu
      # avant que Vercel ne regarde.
      #
      # Un commit VIDE, jamais un amend : reecrire le sommet de main casserait
      # tout depot qui l'a deja recupere. Idempotent par construction — le
      # commit ajoute porte le bon auteur, donc une execution suivante ne fait
      # rien. Et GITHUB_TOKEN ne redeclenche pas les workflows, pas de boucle.
      - name: Signature de promotion (deblocage Vercel Hobby)
        # L'identite attendue est un PARAMETRE, pas une constante : le jour ou
        # le projet Vercel change de compte, c'est une variable a changer, pas
        # du code a rouvrir. GitHub resout `vars` par ordre de precedence
        # environnement > depot, donc la valeur de l'environnement
        # « production » gagne si elle existe, sinon celle du depot sert de
        # defaut. Le litteral en dernier recours evite qu'une variable oubliee
        # ne desactive silencieusement le garde-fou ; le pas dit toujours d'ou
        # vient la valeur qu'il utilise.
        env:
          RELEASE_AUTHOR_NAME: ${{ vars.RELEASE_AUTHOR_NAME }}
          RELEASE_AUTHOR_EMAIL: ${{ vars.RELEASE_AUTHOR_EMAIL }}
        run: |
          set -euo pipefail
          SOURCE="variable GitHub (environnement ou depot)"
          if [ -z "${RELEASE_AUTHOR_EMAIL:-}" ]; then
            RELEASE_AUTHOR_EMAIL="st.operations@greengate.africa"
            SOURCE="defaut integre au workflow"
            echo "::warning::Ni l'environnement « production » ni le depot ne definissent la variable RELEASE_AUTHOR_EMAIL — repli sur le defaut integre. A definir avec: gh variable set RELEASE_AUTHOR_EMAIL --env production"
          fi
          if [ -z "${RELEASE_AUTHOR_NAME:-}" ]; then
            RELEASE_AUTHOR_NAME="Green Gate Operations"
          fi
          echo "Identite de promotion attendue : $RELEASE_AUTHOR_NAME <$RELEASE_AUTHOR_EMAIL> (source : $SOURCE)"
          CURRENT="$(git log -1 --format='%ae')"
          echo "Auteur du sommet de main : $CURRENT"
          if [ "$CURRENT" = "$RELEASE_AUTHOR_EMAIL" ]; then
            echo "Signature deja conforme, rien a faire."
            exit 0
          fi
          echo "::notice::Sommet de main signe « $CURRENT » au lieu de « $RELEASE_AUTHOR_EMAIL » — ajout d'un commit vide de promotion pour ne pas bloquer Vercel."
          git config user.name  "$RELEASE_AUTHOR_NAME"
          git config user.email "$RELEASE_AUTHOR_EMAIL"
          git commit --allow-empty             --author="$RELEASE_AUTHOR_NAME <$RELEASE_AUTHOR_EMAIL>"             -m "release: signature de promotion"             -m "Le sommet de main etait signe $CURRENT. Vercel Hobby exige que
          l'auteur du commit soit le proprietaire de l'equipe, sinon il bloque le
          deploiement. Commit vide ajoute automatiquement par deploy-production."
          if ! git push origin HEAD:main; then
            echo "::error::Impossible de pousser la signature de promotion sur main (protection de branche ou droits manquants). Le deploiement Vercel sera bloque : refaire la fusion en local signee « $RELEASE_AUTHOR_EMAIL », cf docs/runbooks."
            exit 1
          fi
          echo "### Signature de promotion ajoutee (auteur precedent : $CURRENT)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      # Une variable marquee "Sensitive" dans Vercel n'est pas relisible, donc
      # `vercel pull` ne la rapporte pas. Le build local l'inline alors a
      # `undefined` et la production casse a l'execution — c'est ce qui a mis
      # greengate.africa a terre le 2026-08-20 (MIDDLEWARE_INVOCATION_FAILED sur
      # toutes les routes) alors que la variable etait bien presente cote Vercel.
      # Les NEXT_PUBLIC_* sont inlinees au build ET finissent dans le bundle
      # navigateur : elles sont publiques par construction et ne doivent jamais
      # etre marquees Sensitive.
      - name: Verify the pulled env carries the public variables
        run: |
          ENVFILE=".vercel/.env.production.local"
          if [ ! -f "$ENVFILE" ]; then
            echo "::error::$ENVFILE absent — vercel pull n'a rien rapporte."
            exit 1
          fi
          MISSING=""
          for VAR in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if ! grep -qE "^${VAR}=.+" "$ENVFILE"; then
              MISSING="$MISSING $VAR"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Variables absentes du build :$MISSING — verifier qu'elles ne sont pas marquees Sensitive dans le projet Vercel."
            exit 1
          fi
          echo "### Variables publiques presentes dans le build" >> "$GITHUB_STEP_SUMMARY"
        working-directory: frontend

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Deploy Production
        id: deploy
        run: |
          # La CLI attend l'etat READY et rend la main quand le deploiement est
          # promouvable. C'est necessaire : `vercel promote` refuse en 422 un
          # deploiement qui n'est pas pret, et son `--timeout` ne fait PAS
          # patienter (echec en 3 s, verifie le 2026-08-20).
          #
          # L'attente avait paru defaillante les 2026-08-19/20 — 6 h puis 20 min
          # sur "Building..." — mais les deux deploiements concernes etaient
          # BLOQUES par Vercel (auteur du commit sans acces contributeur) et ne
          # seraient jamais devenus prets. Le blocage leve, l'attente se termine
          # normalement. `timeout-minutes` sur le job reste le garde-fou.
          URL=$(vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Frontend: $URL" >> "$GITHUB_STEP_SUMMARY"
        working-directory: frontend

      # Un deploiement `--prod` recupere le domaine de production tout seul :
      # `vercel promote` repond 409 « already the current production deployment »
      # et n'a de sens que pour promouvoir une PREVERSION. L'etape a donc ete
      # retiree, et cette fumigation devient la garantie de mise en ligne.
      #
      # On ne compare pas d'identifiant de deploiement : Vercel n'expose aucun
      # en-tete stable pour cela (x-vercel-id change a chaque requete).
      - name: Smoke-check the production domain
        run: |
          STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 20 "${{ secrets.PRODUCTION_URL }}/login" || echo "000")
          echo "Domaine public: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Le domaine de production repond $STATUS apres deploiement."
            exit 1
          fi
          echo "### Domaine de production sain (HTTP $STATUS)" >> "$GITHUB_STEP_SUMMARY"

  # ── Post-deploy health checks ────────────────────────────────────────────
  healthcheck:
    name: Health Checks
    runs-on: ubuntu-latest
    # Depend des deux deploiements et s'execute meme si l'un echoue : le
    # 2026-08-19, `backend` en echec (facturation Fly) a fait sauter ce job, donc
    # une prod perimee n'a declenche aucun controle.
    needs: [backend, deploy]
    if: ${{ always() }}
    # Resolves PRODUCTION_URL / BACKEND_URL to the PRODUCTION secrets.
    environment: production

    steps:
      - name: Wait for deploy propagation
        run: sleep 15

      - name: Check frontend
        run: |
          # -L: the vercel.app URL 307-redirects to the production domain (greengate.africa).
          STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" "${{ secrets.PRODUCTION_URL }}/login" || echo "000")
          echo "Frontend: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Frontend health check failed with status $STATUS"
            exit 1
          fi
          echo "### Frontend healthy (HTTP $STATUS)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.BACKEND_URL }}/health" || echo "000")
          echo "Backend: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Backend health check failed with status $STATUS"
            exit 1
          fi
          echo "### Backend healthy (HTTP $STATUS)" >> "$GITHUB_STEP_SUMMARY"
