name: Deploy — Production (main)

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false # never cancel a prod deploy mid-flight

jobs:
  # ── Gate: CI must pass first ─────────────────────────────────────────────
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    # Sur main on ne filtre rien : une promotion valide l'ensemble, quel que
    # soit le diff. Le filtrage par chemin n'a lieu que sur develop et les PR.
    with:
      full: true
    secrets: inherit

  # ── Supabase migrations ─────────────────────────────────────────────────
  migrations:
    name: Supabase Migrations
    runs-on: ubuntu-latest
    needs: [ci]
    # Resolves SUPABASE_DB_URL to the PRODUCTION Supabase project's secret.
    environment: production

    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Direct Postgres auth via the pooler URL (secret SUPABASE_DB_URL).
      # `supabase link` needs a management-API access token the CI doesn't have
      # (and the CLI token lacks privileges on this org) — db push --db-url is
      # the proven path used for every hosted push since 2026-05.
      - name: Run migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  # ── Go backend deploy (Fly.io) ──────────────────────────────────────────
  backend:
    name: Fly.io Backend
    runs-on: ubuntu-latest
    needs: [ci, migrations] # tariffs/geofences migrations MUST land before the fail-closed Go deploy (W2)
    # Resolves FLY_API_TOKEN / BACKEND_URL to the PRODUCTION secrets.
    environment: production

    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Paths are relative to working-directory (backend/): the old
      # `--config backend/fly.toml` resolved to backend/backend/fly.toml →
      # flyctl fell back to an empty config ("missing app name") — this job
      # had NEVER succeeded. The Dockerfile expects build context = backend/.
      # `--app greengate-prod` overrides `app = 'africgreen'` in fly.toml so
      # the same config deploys to the dedicated production Fly app (staging
      # keeps the original 'africgreen' app — see deploy-staging.yml).
      - name: Deploy backend
        run: flyctl deploy --remote-only --app greengate-prod --config fly.toml --dockerfile Dockerfile
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Backend health check
        run: |
          sleep 10
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${{ secrets.BACKEND_URL }}/health" || echo "000")
          echo "Backend status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Backend health check returned $STATUS — may still be starting"
          fi
          echo "### Backend: HTTP $STATUS" >> "$GITHUB_STEP_SUMMARY"

  # ── Vercel production deploy ─────────────────────────────────────────────
  deploy:
    name: Vercel Production
    runs-on: ubuntu-latest
    # Opt-in: skips cleanly until VERCEL_TOKEN/ORG_ID/PROJECT_ID secrets are configured.
    # Gated on a REPO-level variable (not environment-scoped): a job-level `if:` is
    # evaluated before the job's environment resolves, so an environment-scoped
    # variable is invisible here and the job would always skip. Enable with:
    #   gh variable set VERCEL_PROD_ENABLED --body "true" -R htleclerc/africgreen
    # Note: `healthcheck` depends on `backend` only and runs regardless of this job.
    if: ${{ vars.VERCEL_PROD_ENABLED == 'true' }}
    needs: [ci, migrations]
    # Sans plafond, `vercel deploy` attend indefiniment que le deploiement soit
    # pret. Le 2026-08-19 le job a consomme les 6 h du plafond GitHub par defaut
    # avant d'etre tue, sans jamais promouvoir l'alias.
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    # VERCEL_ORG_ID / VERCEL_PROJECT_ID let the CLI target the right project on
    # the production Vercel account (possibly a different account than staging)
    # without interactive linking — required for token-based cross-account deploy.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Deploy Production
        id: deploy
        run: |
          # --no-wait : la CLI rend la main des la fin du televersement.
          # Sans lui elle attend l'etat READY et ne le voit jamais : constate le
          # 2026-08-19 sur deux executions (6 h puis 20 min, tuees par le
          # plafond), alors que le deploiement aboutissait bien cote Vercel —
          # son URL servait du 200. `--prebuilt` ne declenche pourtant aucun
          # build distant : c'est l'attente elle-meme qui est en cause.
          URL=$(vercel deploy --prebuilt --prod --yes --no-wait --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Frontend: $URL" >> "$GITHUB_STEP_SUMMARY"
        working-directory: frontend

      # On attend nous-memes, sur un signal observable : le deploiement repond.
      # Borne a ~13 min, largement au-dessus des quelques minutes constatees.
      - name: Wait until the deployment answers
        run: |
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ steps.deploy.outputs.url }}" || echo "000")
            echo "tentative $i — deploiement: HTTP $STATUS"
            # Un deploiement pret repond 2xx OU 3xx : l'URL de deploiement
            # redirige (302) vers le domaine de production. N'accepter que 200
            # faisait boucler l'attente jusqu'au plafond sur un deploiement
            # pourtant sain — constate le 2026-08-20, 24 tentatives a 302.
            case "$STATUS" in
              2??|3??) exit 0 ;;
            esac
            sleep 20
          done
          echo "::error::Le deploiement n'a pas repondu 200 dans le delai imparti."
          exit 1

      # Promotion explicite : ne depend plus du bon deroulement d'une attente
      # interne a la CLI.
      - name: Promote to production domain
        run: vercel promote "${{ steps.deploy.outputs.url }}" --yes --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      # Fumigation. On ne compare pas d'identifiant de deploiement : Vercel
      # n'expose aucun en-tete stable pour cela (x-vercel-id change a chaque
      # requete, verifie le 2026-08-19).
      - name: Smoke-check the production domain
        run: |
          STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 20 "${{ secrets.PRODUCTION_URL }}/login" || echo "000")
          echo "Domaine public: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Le domaine de production repond $STATUS apres promotion."
            exit 1
          fi
          echo "### Domaine de production sain (HTTP $STATUS)" >> "$GITHUB_STEP_SUMMARY"

  # ── Post-deploy health checks ────────────────────────────────────────────
  healthcheck:
    name: Health Checks
    runs-on: ubuntu-latest
    # Depend des deux deploiements et s'execute meme si l'un echoue : le
    # 2026-08-19, `backend` en echec (facturation Fly) a fait sauter ce job, donc
    # une prod perimee n'a declenche aucun controle.
    needs: [backend, deploy]
    if: ${{ always() }}
    # Resolves PRODUCTION_URL / BACKEND_URL to the PRODUCTION secrets.
    environment: production

    steps:
      - name: Wait for deploy propagation
        run: sleep 15

      - name: Check frontend
        run: |
          # -L: the vercel.app URL 307-redirects to the production domain (greengate.africa).
          STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" "${{ secrets.PRODUCTION_URL }}/login" || echo "000")
          echo "Frontend: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Frontend health check failed with status $STATUS"
            exit 1
          fi
          echo "### Frontend healthy (HTTP $STATUS)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.BACKEND_URL }}/health" || echo "000")
          echo "Backend: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Backend health check failed with status $STATUS"
            exit 1
          fi
          echo "### Backend healthy (HTTP $STATUS)" >> "$GITHUB_STEP_SUMMARY"
