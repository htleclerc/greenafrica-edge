name: E2E — Nightly (Playwright)

# Wires the Playwright end-to-end suite into CI (Livrable L9). The functional
# scenarios (smoke, signup auto-claim, wire payment) run against the hosted
# Supabase project and self-clean their data (LIFO, identifiable `e2e-*` rows —
# see frontend/e2e/README.md). Demo screenshot/video scenarios (04, 05) are
# excluded — they are heavyweight and not correctness gates.
#
# ⚠️ These tests write to the REAL hosted database (no staging). Keep this
# nightly and opt-in.
#
# Opt-in: inert until you set the repo variable E2E_ENABLED=true and provide the
# secrets below.
#   gh variable set E2E_ENABLED --body "true" -R htleclerc/africgreen
# Required secrets: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#   SUPABASE_SERVICE_ROLE_KEY. Optional: E2E_BASE_URL (+ E2E_NO_SERVER=1 to test
#   a deployed preview instead of booting a local dev server).

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC nightly
  workflow_dispatch: {} # manual runs from the Actions tab

concurrency:
  group: e2e-nightly
  cancel-in-progress: false # never interrupt a run mid-cleanup (leaves orphan rows)

jobs:
  e2e:
    name: Playwright functional scenarios
    if: ${{ vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run functional E2E scenarios
        run: npm run e2e -- e2e/scenarios/00-smoke.spec.ts e2e/scenarios/01-signup-auto-claim.spec.ts e2e/scenarios/02-wire-payment.spec.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # When E2E_BASE_URL is set, point at a deployed target and skip the local dev server.
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_NO_SERVER: ${{ secrets.E2E_BASE_URL != '' && '1' || '' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
